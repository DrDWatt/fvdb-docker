[pytest]
testpaths = tests
addopts = -ra -p no:cacheprovider --import-mode=importlib
markers =
    integration: runs against the isolated test stack (docker-compose.test.yml --profile integration)
    slow: long-running GPU work (e.g. TRELLIS.2 mesh reconstruction); opt in with -m slow
filterwarnings =
    ignore::DeprecationWarning
